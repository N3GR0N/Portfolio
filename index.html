  <body class="bg-[#0b0b0c] text-stone-200 font-sans antialiased selection:bg-bronze-600/30 selection:text-bronze-200 min-h-screen overflow-x-hidden">
    <!-- SVG Noise Texture Filter overlay for subtle tactile grain without banding -->
    <svg class="pointer-events-none fixed isolate z-50 opacity-[0.025] mix-blend-overlay inset-0 w-full h-full" xmlns="http://www.w3.org/2000/svg">
      <filter id="noise">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch" />
        <feColorMatrix type="saturate" values="0" />
      </filter>
      <rect width="100%" height="100%" filter="url(#noise)" />
    </svg>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
